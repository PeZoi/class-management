services:
  backend:
    # build:
    #   context: ./back-end
    #   dockerfile: Dockerfile
    image: pezoi/class-management-backend:latest
    container_name: class_management_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: ${JAVA_OPTS}
      # Timezone (mặc định: Asia/Ho_Chi_Minh cho Việt Nam)
      TZ: Asia/Ho_Chi_Minh
      # Kết nối với MySQL trên máy host thông qua host.docker.internal
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EMAIL: ${EMAIL}
      PASSWORD_EMAIL: ${PASSWORD_EMAIL}
      JWT_KEY_SECRET: ${JWT_KEY_SECRET}

      # Telegram
      APP_ENV: ${APP_ENV}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

      # Backup database
      BACKUP_ENABLED: ${BACKUP_ENABLED}
      BACKUP_CRON: ${BACKUP_CRON}
      BACKUP_KEEP_FILES: ${BACKUP_KEEP_FILES}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - class_management_network
    # Remove volume mount to prevent overwriting the JAR file
    # volumes:
    #   - ./back-end:/app
    #   - /app/target

  frontend:
    # build:
    #   context: ./front-end
    #   dockerfile: Dockerfile
    #   args:
    #     NEXT_PUBLIC_API_ENDPOINT: ''
    image: pezoi/class-management-frontend:latest
    container_name: class_management_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - class_management_network
    # Remove volume mounts to prevent overwriting built files
    # If you need hot-reload during development, uncomment these
    # volumes:
    #   - ./front-end:/app
    #   - /app/node_modules
    #   - /app/.next
networks:
  class_management_network:
    driver: bridge