spring.application.name=back-end

# Load env from .env (docker-compose)
spring.config.import=optional:file:.env[.properties]

# ===============================
# DATASOURCE (MYSQL OUTSIDE DOCKER)
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===============================
# HIKARI POOL (OPTIMIZED FOR VPS - wait_timeout=28800s)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Idle 10 minutes
spring.datasource.hikari.idle-timeout=600000
# 15 minutes for safety
spring.datasource.hikari.max-lifetime=900000
# Ping every 5 minutes
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
# Leak detection only enable when debugging
spring.datasource.hikari.leak-detection-threshold=0


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===============================
# LOGGING (PRODUCTION SAFE)
# ===============================
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate.SQL=WARN

# ===============================
# JWT
# ===============================
key-secret=${JWT_KEY_SECRET}
access-token-expiration=900000
refresh-token-expiration=604800000

# ===============================
# EMAIL
# ===============================
gmail.email=${EMAIL}
gmail.password=${PASSWORD_EMAIL}
