spring.application.name=back-end

# Load env từ file .env (docker-compose)
spring.config.import=optional:file:.env[.properties]

# ===============================
# DATASOURCE (MYSQL OUTSIDE DOCKER)
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===============================
# HIKARI POOL (TỐI ƯU CHO VPS - wait_timeout=28800s)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# 10 phút - thời gian connection idle trước khi bị đóng
spring.datasource.hikari.idle-timeout=600000    
# 6 giờ (21600000ms) - nhỏ hơn MySQL wait_timeout (8 giờ = 28800s)
# Đảm bảo connection được thay thế trước khi MySQL đóng
spring.datasource.hikari.max-lifetime=21600000        
# 5 phút - kiểm tra connection còn sống định kỳ
spring.datasource.hikari.keepalive-time=300000      
# 30 giây - timeout khi lấy connection từ pool
spring.datasource.hikari.connection-timeout=30000
# 5 giây - timeout khi validate connection
spring.datasource.hikari.validation-timeout=5000
# Query để test connection (SELECT 1 là nhanh nhất)
spring.datasource.hikari.connection-test-query=SELECT 1
# Phát hiện connection leak sau 60 giây
spring.datasource.hikari.leak-detection-threshold=60000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===============================
# LOGGING (PRODUCTION SAFE)
# ===============================
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate.SQL=WARN

# ===============================
# JWT
# ===============================
key-secret=${JWT_KEY_SECRET}
access-token-expiration=900000
refresh-token-expiration=604800000

# ===============================
# EMAIL
# ===============================
gmail.email=${EMAIL}
gmail.password=${PASSWORD_EMAIL}
