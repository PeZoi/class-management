services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    # image: pezoi/class-management-backend:latest
    container_name: class-management-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: ${JAVA_OPTS}
      # Kết nối với MySQL trên máy host thông qua host.docker.internal
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EMAIL: ${EMAIL}
      PASSWORD_EMAIL: ${PASSWORD_EMAIL}
      JWT_KEY_SECRET: ${JWT_KEY_SECRET}
      
      # Telegram
      APP_ENV: ${APP_ENV:production}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:8319765133:AAFLSvSd83PnNE-VVvekAmI36znQkv0437c}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:1777363419}

      # Backup database
      BACKUP_ENABLED: ${BACKUP_ENABLED:true}
      BACKUP_CRON: ${BACKUP_CRON:0 0 2 * * ?}
      BACKUP_KEEP_FILES: ${BACKUP_KEEP_FILES:5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - class_management_network
    # Remove volume mount to prevent overwriting the JAR file
    # volumes:
    #   - ./back-end:/app
    #   - /app/target

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_ENDPOINT: ''
    # image: pezoi/class-management-frontend:latest
    container_name: class-management-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - class_management_network
    # Remove volume mounts to prevent overwriting built files
    # If you need hot-reload during development, uncomment these
    # volumes:
    #   - ./front-end:/app
    #   - /app/node_modules
    #   - /app/.next

networks:
  class_management_network:
    driver: bridge

