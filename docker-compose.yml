services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    # image: pezoi/class-management-backend:latest
    container_name: class-management-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Kết nối với MySQL trên máy host thông qua host.docker.internal
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      EMAIL: ${EMAIL}
      PASSWORD_EMAIL: ${PASSWORD_EMAIL}
      JWT_KEY_SECRET: ${JWT_KEY_SECRET}
      
      # Telegram
      APP_ENV: ${APP_ENV}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

      # Backup database
      BACKUP_ENABLED: ${BACKUP_ENABLED}
      BACKUP_CRON: ${BACKUP_CRON}
      BACKUP_KEEP_FILES: ${BACKUP_KEEP_FILES}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - class_management_network
    # Remove volume mount to prevent overwriting the JAR file
    # volumes:
    #   - ./back-end:/app
    #   - /app/target

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_ENDPOINT: ''
        NEXT_PUBLIC_CHATBOT_API_URL: ''
    # image: pezoi/class-management-frontend:latest
    container_name: class-management-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - chatbot
    networks:
      - class_management_network
    # Remove volume mounts to prevent overwriting built files
    # If you need hot-reload during development, uncomment these
    # volumes:
    #   - ./front-end:/app
    #   - /app/node_modules
    #   - /app/.next

  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: class-management-chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      JAVA_OPTS: ${JAVA_OPTS}
      # DB
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # AI
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      GROQ_BASE_URL: ${GROQ_BASE_URL}
    networks:
      - class_management_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  class_management_network:
    driver: bridge

