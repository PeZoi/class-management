name: CI/CD - Build & Deploy to VPS

on:
  push:
    branches:
      - production

jobs:
  # ===================================================
  # JOB 1: Build & Push Docker images lên Docker Hub
  # ===================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    environment: Deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- Build & Push Backend ----------
      - name: Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          file: ./back-end/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/class-management-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/class-management-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ---------- Build & Push Frontend ----------
      - name: Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          file: ./front-end/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/class-management-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/class-management-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ===================================================
  # JOB 2: Deploy lên VPS (sau khi build xong)
  # ===================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push  # chờ job build xong mới chạy
    environment: Deploy
    # Luôn chạy bước notify dù deploy thành công hay thất bại
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "=== [1/4] Chuyển vào thư mục deploy ==="
            cd /opt/apps/class_management

            echo "=== [2/4] Pull Docker images mới nhất ==="
            docker compose pull

            echo "=== [3/4] Restart containers với image mới ==="
            docker compose up -d --remove-orphans

            echo "=== [4/4] Xóa images cũ không dùng ==="
            docker image prune -f

            echo "✅ Deploy thành công!"

      # ---------- Telegram: Thành công ----------
      - name: Notify Telegram - Success
        if: needs.build-and-push.result == 'success' && steps.deploy.outcome == 'success'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TEXT=$(printf "✅ <b>Deploy thành công!</b>\n\n🔖 Commit: <code>%s</code>\n👤 Author: ${{ github.actor }}\n📝 Message: ${{ github.event.head_commit.message }}\n🔗 <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Xem workflow</a>\n\n#deploy #success" "$SHORT_SHA")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}"

      # ---------- Telegram: Thất bại ----------
      - name: Notify Telegram - Failure
        if: needs.build-and-push.result == 'failure' || steps.deploy.outcome == 'failure'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TEXT=$(printf "❌ <b>Deploy thất bại!</b>\n\n🔖 Commit: <code>%s</code>\n👤 Author: ${{ github.actor }}\n📝 Message: ${{ github.event.head_commit.message }}\n🔗 <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Xem logs</a>\n\n#deploy #failed" "$SHORT_SHA")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}"
