name: CI/CD - Build & Deploy to VPS

on:
  push:
    branches:
      - production

jobs:
  # ===================================================
  # JOB 1: Build & Push Docker images lên Docker Hub
  # ===================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- Build & Push Backend ----------
      - name: Build & Push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          dockerfile: ./back-end/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/class-management-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/class-management-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ---------- Build & Push Frontend ----------
      - name: Build & Push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          dockerfile: ./front-end/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/class-management-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/class-management-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ===================================================
  # JOB 2: Deploy lên VPS (sau khi build xong)
  # ===================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push  # chờ job build xong mới chạy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "=== [1/4] Chuyển vào thư mục deploy ==="
            cd /opt/apps/class_management

            echo "=== [2/4] Pull Docker images mới nhất ==="
            docker compose pull

            echo "=== [3/4] Restart containers với image mới ==="
            docker compose up -d --remove-orphans

            echo "=== [4/4] Xóa images cũ không dùng ==="
            docker image prune -f

            echo "✅ Deploy thành công!"

